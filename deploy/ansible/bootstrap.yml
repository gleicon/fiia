---
# Fiia agent bootstrap playbook.
# Runs once per node during fleet onboarding. Idempotent.
# Installs fiia-agent as a systemd service and records the drift manifest
# as the last provisioning step. No hub, no shared secrets, no certificates:
# drift verdicts and liveness go to your OTel pipeline (stdout by default,
# OTLP when fiia_otlp_endpoint is set).
#
# Constraints:
#   - serial: 5% to partition rollout by workload tag
#   - No shell/command/raw tasks (declarative-only policy)
#
# Required variables (set in inventory or group_vars):
#   fiia_agent_binary - local path to fiia-agent binary to deploy
#
# Manifest variables (what gets tracked — your drift surface):
#   fiia_manifest_files    - list of absolute file paths
#   fiia_manifest_packages - list of package names (or name=version)
#   fiia_manifest_services - list of service names
#   fiia_manifest_snapshot - true to also record full package/service lists
#
# Requires the fiia.fleet collection (provides the agent role + binary):
#   ansible-galaxy collection install git+https://github.com/gleicon/fiia.git#/ansible/collections/fiia/fleet

- name: Bootstrap fiia agent
  hosts: fleet
  serial: "5%"
  become: true
  vars:
    fiia_install_dir: /usr/local/bin
    fiia_config_dir: /etc/fiia
    fiia_log_dir: /var/log/fiia
    fiia_user: fiia
    fiia_heartbeat_interval_sec: 60
    fiia_audit_interval_sec: 1200
    fiia_audit_jitter_max_sec: 120
    fiia_otlp_endpoint: ""
    fiia_manifest_files: []
    fiia_manifest_packages: []
    fiia_manifest_services: []
    fiia_manifest_snapshot: false

  tasks:
    - name: Create fiia system user (no login shell, no sudo)
      ansible.builtin.user:
        name: "{{ fiia_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create config and log directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ fiia_config_dir }}", owner: root, mode: "0755" }
        - { path: "{{ fiia_log_dir }}", owner: "{{ fiia_user }}", mode: "0750" }

    - name: Write agent configuration (0400)
      ansible.builtin.template:
        src: agent.toml.j2
        dest: "{{ fiia_config_dir }}/agent.toml"
        owner: "{{ fiia_user }}"
        group: root
        mode: "0400"

    - name: Install fiia-agent binary
      ansible.builtin.copy:
        src: "{{ fiia_agent_binary }}"
        dest: "{{ fiia_install_dir }}/fiia-agent"
        owner: root
        group: root
        mode: "0755"

    - name: Install systemd unit
      ansible.builtin.template:
        src: files/fiia-agent.service.j2
        dest: /etc/systemd/system/fiia-agent.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install logrotate config
      ansible.builtin.copy:
        src: files/fiia-logrotate
        dest: /etc/logrotate.d/fiia
        owner: root
        group: root
        mode: "0644"

    - name: Record drift manifest (last provisioning step)
      ansible.builtin.command:
        argv: "{{ [fiia_install_dir ~ '/fiia-agent', '-write-manifest', '-manifest', fiia_config_dir ~ '/manifest.json', '-files', (fiia_manifest_files | join(',')), '-packages', (fiia_manifest_packages | join(',')), '-services', (fiia_manifest_services | join(','))] + (['-snapshot'] if fiia_manifest_snapshot else []) }}"
      register: fiia_record
      changed_when: "'wrote ' in fiia_record.stdout"

    - name: Enable and start fiia-agent
      ansible.builtin.systemd:
        name: fiia-agent
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify baseline reads clean
      ansible.builtin.command:
        argv:
          - "{{ fiia_install_dir }}/fiia-agent"
          - -check
          - -manifest
          - "{{ fiia_config_dir }}/manifest.json"
      register: fiia_check
      changed_when: false
      failed_when: fiia_check.rc != 0

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
