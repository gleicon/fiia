---
# Fiia dev bootstrap: installs the agent on a Lima VM, Colima VM, or localhost
# (Linux). Run via: make dev-deploy
#
# Override with -e: fiia_agent_binary (path to the linux binary),
# fiia_otlp_endpoint (OTLP/HTTP receiver; omit for stdout export).

- name: Bootstrap fiia agent on dev node
  hosts: fleet
  become: true
  vars:
    fiia_heartbeat_interval_sec: 30
    fiia_audit_interval_sec: 120
    fiia_audit_jitter_max_sec: 10
    fiia_manifest_files:
      - /etc/fiia/sentinel
      - /etc/motd

  tasks:
    - name: Create config directory
      ansible.builtin.file:
        path: /etc/fiia
        state: directory
        mode: "0755"

    - name: Write dev baseline files
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - dest: /etc/fiia/sentinel
          content: |
            # managed by fiia baseline — do not edit
            version: 1
            state: ok
        - dest: /etc/motd
          content: "Authorized access only. Activity is monitored by Fiia.\n"

    - name: Install and start fiia-agent
      ansible.builtin.include_role:
        name: fiia.fleet.agent