version: "3.8"

# Live-observability override: add Prometheus (stores the metrics, evaluates
# alert rules) and Grafana (dashboard) on top of the base e2e stack.
# Run with: make e2e-live   (uses `docker compose -f docker-compose.yml -f docker-compose.observe.yml`)
services:
  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./observe/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observe/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otelcol

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observe/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observe/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus