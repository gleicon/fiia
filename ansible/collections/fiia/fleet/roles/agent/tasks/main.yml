---
- name: Create fiia system user (no login shell, no sudo)
  ansible.builtin.user:
    name: "{{ fiia_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create config and log directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ fiia_config_dir }}", owner: root, mode: "0755" }
    - { path: "{{ fiia_log_dir }}", owner: "{{ fiia_user }}", mode: "0750" }

- name: Write agent configuration (0400)
  ansible.builtin.template:
    src: agent.toml.j2
    dest: "{{ fiia_config_dir }}/agent.toml"
    owner: "{{ fiia_user }}"
    group: root
    mode: "0400"
  notify: Restart fiia-agent

- name: Install fiia-agent binary
  ansible.builtin.copy:
    src: "{{ fiia_agent_binary }}"
    dest: "{{ fiia_install_dir }}/fiia-agent"
    owner: root
    group: root
    mode: "0755"
  notify: Restart fiia-agent

- name: Install systemd unit
  ansible.builtin.template:
    src: fiia-agent.service.j2
    dest: /etc/systemd/system/fiia-agent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart fiia-agent

- name: Install logrotate config
  ansible.builtin.copy:
    src: fiia-logrotate
    dest: /etc/logrotate.d/fiia
    owner: root
    group: root
    mode: "0644"

- name: Build manifest record command
  ansible.builtin.set_fact:
    fiia_record_argv: "{{ [fiia_install_dir ~ '/fiia-agent', '-write-manifest', '-manifest', fiia_manifest_path, '-files', (fiia_manifest_files | join(',')), '-packages', (fiia_manifest_packages | join(',')), '-services', (fiia_manifest_services | join(','))] + (['-snapshot'] if fiia_manifest_snapshot else []) }}"
  when: fiia_manage_manifest

- name: Record drift manifest (last provisioning step)
  ansible.builtin.command:
    argv: "{{ fiia_record_argv }}"
  register: fiia_record
  changed_when: "'wrote ' in fiia_record.stdout"
  when: fiia_manage_manifest

- name: Make manifest readable by the fiia service account (still 0400)
  ansible.builtin.file:
    path: "{{ fiia_manifest_path }}"
    owner: "{{ fiia_user }}"
    group: root
    mode: "0400"
  when: fiia_manage_manifest

- name: Enable and start fiia-agent
  ansible.builtin.systemd:
    name: fiia-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Verify baseline reads clean
  ansible.builtin.command:
    argv:
      - "{{ fiia_install_dir }}/fiia-agent"
      - -check
      - -manifest
      - "{{ fiia_manifest_path }}"
  register: fiia_check
  changed_when: false
  failed_when: fiia_check.rc != 0
  when: fiia_manage_manifest
